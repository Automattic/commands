name: Publish npm package

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-trunk
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout trunk
        uses: actions/checkout@v7
        with:
          ref: trunk
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE'
          const fs = require( 'node:fs' );

          const packageJson = JSON.parse( fs.readFileSync( 'package.json', 'utf8' ) );

          fs.appendFileSync( process.env.GITHUB_OUTPUT, `name=${ packageJson.name }\n` );
          fs.appendFileSync( process.env.GITHUB_OUTPUT, `version=${ packageJson.version }\n` );
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Check GitHub release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          tag_name="v$PACKAGE_VERSION"

          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "::error::GitHub release $tag_name already exists."
            exit 1
          fi

      - name: Check npm version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$PACKAGE_VERSION is already published on npm."
            exit 1
          fi

      - name: Preview npm package
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          tag_name="v$PACKAGE_VERSION"
          gh release create "$tag_name" --target "$GITHUB_SHA" --title "$tag_name" --generate-notes
